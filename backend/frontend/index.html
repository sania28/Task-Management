<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dispatch — Task Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<!-- ===== Auth screen ===== -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <h1 class="wordmark">Dispatch</h1>
    <p class="tagline">A board for tasks that actually need doing.</p>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Sign in</button>
      <button class="auth-tab" data-tab="register">Create account</button>
    </div>

    <form id="login-form" class="auth-form">
      <label>Email
        <input type="email" name="email" required autocomplete="email" />
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password" />
      </label>
      <p class="form-error" id="login-error"></p>
      <button type="submit">Sign in</button>
    </form>

    <form id="register-form" class="auth-form" hidden>
      <label>Name
        <input type="text" name="name" required autocomplete="name" />
      </label>
      <label>Email
        <input type="email" name="email" required autocomplete="email" />
      </label>
      <label>Password
        <input type="password" name="password" required minlength="6" autocomplete="new-password" />
        <span class="hint">At least 6 characters.</span>
      </label>
      <p class="form-error" id="register-error"></p>
      <button type="submit">Create account</button>
    </form>
  </div>
</div>

<!-- ===== Board screen ===== -->
<div id="board-screen" class="board-screen" hidden>
  <aside class="sidebar">
    <h1 class="wordmark">Dispatch</h1>
    <nav class="filters">
      <button class="filter-btn active" data-filter="all">All tasks</button>
      <button class="filter-btn" data-filter="overdue">Overdue</button>
      <button class="filter-btn" data-filter="high">High priority</button>
    </nav>
    <div class="sidebar-footer">
      <div class="live-indicator" id="live-indicator">
        <span class="dot"></span> Live
      </div>
      <div class="account">
        <span id="user-name"></span>
        <button id="logout-btn" class="link-btn">Sign out</button>
      </div>
    </div>
  </aside>

  <main class="board-main">
    <header class="board-header">
      <input type="search" id="search-input" placeholder="Search tasks…" />
      <button id="new-task-btn">New task</button>
    </header>

    <div class="board-columns">
      <section class="column" data-status="todo">
        <h2>To do <span class="count" id="count-todo">0</span></h2>
        <div class="card-list" id="list-todo"></div>
      </section>
      <section class="column" data-status="in_progress">
        <h2>In progress <span class="count" id="count-in_progress">0</span></h2>
        <div class="card-list" id="list-in_progress"></div>
      </section>
      <section class="column" data-status="done">
        <h2>Done <span class="count" id="count-done">0</span></h2>
        <div class="card-list" id="list-done"></div>
      </section>
    </div>
  </main>
</div>

<!-- ===== New / edit task dialog ===== -->
<dialog id="task-dialog">
  <form id="task-form" method="dialog">
    <h2 id="dialog-title">New task</h2>
    <input type="hidden" name="id" />
    <label>Title
      <input type="text" name="title" required maxlength="120" />
    </label>
    <label>Description
      <textarea name="description" rows="3" maxlength="1000"></textarea>
    </label>
    <div class="form-row">
      <label>Priority
        <select name="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </label>
      <label>Due date
        <input type="date" name="dueDate" />
      </label>
    </div>
    <div class="dialog-actions">
      <button type="button" id="delete-task-btn" class="link-btn danger" hidden>Delete task</button>
      <span class="spacer"></span>
      <button type="button" id="cancel-dialog-btn" class="ghost-btn">Cancel</button>
      <button type="submit" id="save-task-btn">Save task</button>
    </div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
