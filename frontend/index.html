<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Manager — Professional Task Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<!-- ===== Auth screen ===== -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo-section">
        <div class="logo">✓</div>
        <h1 class="app-title">Task Manager</h1>
      </div>
      <p class="tagline">Organize, prioritize, and accomplish your goals</p>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Sign in</button>
        <button class="auth-tab" data-tab="register">Create account</button>
      </div>

      <form id="login-form" class="auth-form">
        <label>
          Email
          <input type="email" name="email" required autocomplete="email" placeholder="your@email.com" />
        </label>
        <label>
          Password
          <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
        </label>
        <p class="form-error" id="login-error"></p>
        <button type="submit" class="submit-btn">Sign in</button>
      </form>

      <form id="register-form" class="auth-form" hidden>
        <label>
          Full Name
          <input type="text" name="name" required autocomplete="name" placeholder="Your name" />
        </label>
        <label>
          Email
          <input type="email" name="email" required autocomplete="email" placeholder="your@email.com" />
        </label>
        <label>
          Password
          <input type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="Min. 6 characters" />
          <span class="hint">Must be at least 6 characters long</span>
        </label>
        <p class="form-error" id="register-error"></p>
        <button type="submit" class="submit-btn">Create account</button>
      </form>
    </div>
  </div>
</div>

<!-- ===== Board screen ===== -->
<div id="board-screen" class="board-screen" hidden>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">✓</div>
      <h1 class="sidebar-title">Task Manager</h1>
    </div>
    
    <nav class="filters">
      <div class="filters-label">Filters</div>
      <button class="filter-btn active" data-filter="all">📋 All tasks</button>
      <button class="filter-btn" data-filter="overdue">⚠️ Overdue</button>
      <button class="filter-btn" data-filter="high">🔴 High priority</button>
    </nav>
    
    <div class="sidebar-footer">
      <div class="live-indicator" id="live-indicator">
        <span class="dot"></span>
        <span>Live sync</span>
      </div>
      <div class="account">
        <div class="user-info">
          <div class="user-avatar">👤</div>
          <span id="user-name"></span>
        </div>
        <button id="logout-btn" class="link-btn">Sign out</button>
      </div>
    </div>
  </aside>

  <main class="board-main">
    <header class="board-header">
      <input type="search" id="search-input" placeholder="🔍 Search tasks…" />
      <button id="new-task-btn" class="primary-btn">+ New task</button>
    </header>

    <div class="board-columns">
      <section class="column" data-status="todo">
        <div class="column-header">
          <h2>📝 To Do</h2>
          <span class="count" id="count-todo">0</span>
        </div>
        <div class="card-list" id="list-todo"></div>
      </section>
      <section class="column" data-status="in_progress">
        <div class="column-header">
          <h2>⚡ In Progress</h2>
          <span class="count" id="count-in_progress">0</span>
        </div>
        <div class="card-list" id="list-in_progress"></div>
      </section>
      <section class="column" data-status="done">
        <div class="column-header">
          <h2>✅ Done</h2>
          <span class="count" id="count-done">0</span>
        </div>
        <div class="card-list" id="list-done"></div>
      </section>
    </div>
  </main>
</div>

<!-- ===== New / edit task dialog ===== -->
<dialog id="task-dialog">
  <div class="dialog-header">
    <h2 id="dialog-title">New task</h2>
    <button type="button" class="close-btn" id="close-dialog">✕</button>
  </div>
  <form id="task-form" method="dialog">
    <input type="hidden" name="id" />
    
    <label>
      Task title
      <input type="text" name="title" required maxlength="120" placeholder="What needs to be done?" />
    </label>
    
    <label>
      Description
      <textarea name="description" rows="3" maxlength="1000" placeholder="Add more details..."></textarea>
    </label>
    
    <div class="form-row">
      <label>
        Priority
        <select name="priority">
          <option value="low">🟢 Low</option>
          <option value="medium" selected>🟡 Medium</option>
          <option value="high">🔴 High</option>
        </select>
      </label>
      <label>
        Due date
        <input type="date" name="dueDate" />
      </label>
    </div>
    
    <div class="dialog-actions">
      <button type="button" id="delete-task-btn" class="danger-btn" hidden>Delete task</button>
      <span class="spacer"></span>
      <button type="button" id="cancel-dialog-btn" class="secondary-btn">Cancel</button>
      <button type="submit" id="save-task-btn" class="primary-btn">Save task</button>
    </div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
